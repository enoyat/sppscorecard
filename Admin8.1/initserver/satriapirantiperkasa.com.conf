<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	ServerName satriapirantiperkasa.com
	ServerAlias www.satriapirantiperkasa.com
	DocumentRoot /var/www/html/satriapirantiperkasa.com

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

RewriteEngine on
RewriteCond %{SERVER_NAME} =www.satriapirantiperkasa.com [OR]
RewriteCond %{SERVER_NAME} =satriapirantiperkasa.com
#RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
